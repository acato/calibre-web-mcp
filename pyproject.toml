[project]
name = "calibre-web-mcp"
version = "0.1.0a0"
description = "MCP server for Calibre-Web — shelf management, search, and library audits"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "calibre-web-mcp contributors" }]
keywords = ["mcp", "calibre", "calibre-web", "ebook", "library"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "fastmcp>=2.10",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.urls]
Homepage = "https://github.com/acato/calibre-web-mcp"
Issues = "https://github.com/acato/calibre-web-mcp/issues"

[project.scripts]
calibre-web-mcp = "calibre_web_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calibre_web_mcp"]
